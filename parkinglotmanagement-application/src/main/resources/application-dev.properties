# Development profile: in-memory H2, no external database required.
#   ./mvnw -pl parkinglotmanagement-application spring-boot:run -Dspring-boot.run.profiles=dev
#
# The Flyway migrations run against H2 exactly as they do against PostgreSQL -
# V2 is deliberately written in the DDL subset both accept.

spring.datasource.url=jdbc:h2:mem:parkinglotmanagement;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jooq.sql-dialect=H2

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoint.health.show-details=always
logging.level.org.jooq.tools.LoggerListener=DEBUG

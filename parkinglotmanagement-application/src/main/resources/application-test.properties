# Test profile: a throwaway in-memory H2 per JVM, migrated by Flyway.
# Nothing external is required, so `mvnw verify` works on a clean machine.

spring.datasource.url=jdbc:h2:mem:parkinglotmanagement-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jooq.sql-dialect=H2

spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# The scheduler would race the tests it shares a database with.
parking.reservation.expiry.enabled=false

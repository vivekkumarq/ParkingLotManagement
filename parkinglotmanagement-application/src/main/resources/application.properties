spring.application.name=parkinglotmanagement
server.port=${SERVER_PORT:8083}

# ---------------------------------------------------------------------------
# Datasource. Nothing is hard-coded: every value reads an environment variable
# with a development-friendly default, so the same jar runs locally and in a
# container. See .env.example for the full list.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parkinglotmanagement}
spring.datasource.username=${DB_USERNAME:parking}
spring.datasource.password=${DB_PASSWORD:parking}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# ---------------------------------------------------------------------------
# Flyway owns the schema. Hibernate is not on at run time (see
# ParkinglotmanagementApplication), so nothing can alter it behind Flyway's back.
# ---------------------------------------------------------------------------
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

spring.jooq.sql-dialect=${JOOQ_DIALECT:Postgres}

# ---------------------------------------------------------------------------
# Rate card. Money is parsed into BigDecimal; keep two decimals.
# ---------------------------------------------------------------------------
parking.rate-card.currency=${RATE_CURRENCY:INR}
parking.rate-card.grace-period-minutes=${RATE_GRACE_MINUTES:15}
parking.rate-card.overstay-penalty-per-hour=${RATE_OVERSTAY_PER_HOUR:50.00}

parking.rate-card.rates.MOTORCYCLE.first-hour=${RATE_MOTORCYCLE_FIRST_HOUR:20.00}
parking.rate-card.rates.MOTORCYCLE.per-additional-hour=${RATE_MOTORCYCLE_ADDITIONAL_HOUR:10.00}
parking.rate-card.rates.MOTORCYCLE.daily-cap=${RATE_MOTORCYCLE_DAILY_CAP:100.00}

parking.rate-card.rates.CAR.first-hour=${RATE_CAR_FIRST_HOUR:50.00}
parking.rate-card.rates.CAR.per-additional-hour=${RATE_CAR_ADDITIONAL_HOUR:30.00}
parking.rate-card.rates.CAR.daily-cap=${RATE_CAR_DAILY_CAP:400.00}

parking.rate-card.rates.TRUCK.first-hour=${RATE_TRUCK_FIRST_HOUR:100.00}
parking.rate-card.rates.TRUCK.per-additional-hour=${RATE_TRUCK_ADDITIONAL_HOUR:60.00}
parking.rate-card.rates.TRUCK.daily-cap=${RATE_TRUCK_DAILY_CAP:800.00}

# ---------------------------------------------------------------------------
# Background sweep that releases slots held by unclaimed bookings.
# ---------------------------------------------------------------------------
parking.reservation.expiry.enabled=${RESERVATION_EXPIRY_ENABLED:true}
parking.reservation.expiry.interval-ms=${RESERVATION_EXPIRY_INTERVAL_MS:300000}
parking.reservation.expiry.initial-delay-ms=${RESERVATION_EXPIRY_INITIAL_DELAY_MS:60000}

# ---------------------------------------------------------------------------
# API documentation: Swagger UI at /swagger-ui.html, the raw document at /v3/api-docs
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------------------------------------------------------------------------
# Actuator: /actuator/health backs the container healthcheck.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}

# Let the global exception handler answer for unmapped paths instead of
# Spring's default HTML error page.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

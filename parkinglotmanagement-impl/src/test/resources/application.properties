# Test harness for the impl module: in-memory H2, migrated by the real Flyway
# scripts from parkinglotmanagement-database. Nothing external is required.
spring.datasource.url=jdbc:h2:mem:impl-tests;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jooq.sql-dialect=H2

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=INFO
